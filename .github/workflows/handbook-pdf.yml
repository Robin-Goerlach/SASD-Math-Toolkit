name: Build handbook PDFs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/handbook-pdf.yml'
      - 'docs/user-guide/de/**/*.md'
      - 'docs/user-guide/en/**/*.md'
      - 'docs/user-guide/LaTeX/**'

permissions:
  contents: read

concurrency:
  group: handbook-pdf-main
  cancel-in-progress: true

jobs:
  build-handbooks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install handbook toolchain
        run: |
          sudo apt-get update
          # German Babel support is needed by the DE handbook entry point.
          sudo apt-get install -y pandoc latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-lang-german fonts-dejavu poppler-utils

      - name: Build German and English handbooks
        working-directory: docs/user-guide/LaTeX
        run: make all

      - name: Validate generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          de_pdf='docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf'
          en_pdf='docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf'
          test -s "$de_pdf"
          test -s "$en_pdf"
          pdfinfo "$de_pdf" | grep -q '^Pages:'
          pdfinfo "$en_pdf" | grep -q '^Pages:'

      - name: Upload V1.0 handbook PDFs for inspection
        uses: actions/upload-artifact@v7
        with:
          name: sasd-math-toolkit-handbooks-v1.0.0
          path: |
            docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf
            docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf
          if-no-files-found: error
          retention-days: 30

      # Deliberately do not commit generated PDFs from ordinary CI. PDF producer
      # metadata can change binary bytes between otherwise equivalent builds.
      # Committed PDF snapshots are updated explicitly at RC/release boundaries
      # after inspection; normal handbook CI remains read-only.
