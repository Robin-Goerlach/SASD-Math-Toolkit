name: Build handbook PDFs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/handbook-pdf.yml'
      - 'docs/user-guide/de/**/*.md'
      - 'docs/user-guide/en/**/*.md'
      - 'docs/user-guide/LaTeX/**'

# Final V1.0 promotion temporarily needs write access so the explicitly reviewed
# release snapshots can be committed. This is reverted to read-only immediately
# after the final PDFs have been generated and inspected.
permissions:
  contents: write

concurrency:
  group: handbook-pdf-main
  cancel-in-progress: true

jobs:
  build-handbooks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install handbook toolchain
        run: |
          sudo apt-get update
          # German Babel support is needed by the DE handbook entry point.
          sudo apt-get install -y pandoc latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-lang-german fonts-dejavu poppler-utils

      - name: Build German and English handbooks
        working-directory: docs/user-guide/LaTeX
        run: make all

      - name: Validate generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          de_pdf='docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf'
          en_pdf='docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf'
          test -s "$de_pdf"
          test -s "$en_pdf"
          pdfinfo "$de_pdf" | grep -q '^Pages:'
          pdfinfo "$en_pdf" | grep -q '^Pages:'

      - name: Upload final V1.0 handbook PDFs for release inspection
        uses: actions/upload-artifact@v7
        with:
          name: sasd-math-toolkit-handbooks-v1.0.0
          path: |
            docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf
            docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publish final V1.0 PDF snapshots
        shell: bash
        run: |
          set -euo pipefail
          cp docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf docs/user-guide/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf
          cp docs/user-guide/LaTeX/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf docs/user-guide/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/user-guide/SASD-Math-Toolkit-Handbuch-V1.0-DE.pdf docs/user-guide/SASD-Math-Toolkit-Handbook-V1.0-EN.pdf
          if git diff --cached --quiet; then
            echo "Final V1.0 PDF snapshots are already up to date."
          else
            git commit -m "Publish final V1.0 handbook PDFs"
            git push
          fi
