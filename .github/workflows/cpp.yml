name: cpp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpp.yml'
      - 'src/cpp/**'
      - 'tests/cpp/**'
      - 'samples/cpp/**'
      - 'conformance/**'
      - 'eng/cpp-verify.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpp.yml'
      - 'src/cpp/**'
      - 'tests/cpp/**'
      - 'samples/cpp/**'
      - 'conformance/**'
      - 'eng/cpp-verify.sh'

permissions:
  contents: read

jobs:
  build-test-install:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
          - name: Clang
            cxx: clang++

    env:
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify C++ build, tests, sample and installation
        run: ./eng/cpp-verify.sh full
